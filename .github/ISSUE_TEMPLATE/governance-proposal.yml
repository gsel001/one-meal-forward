name: "Governance proposal or Charter amendment"
description: "Suggest a policy, role, election, safeguarding or constitutional change. Discussion is not approval."
title: "[Governance] "
body:
  - type: markdown
    attributes:
      value: |
        This form opens a **proposal**, not a vote or approved change. Read [GOVERNANCE.md](https://github.com/gsel001/one-meal-forward/blob/main/GOVERNANCE.md) and the [proposed Charter](https://github.com/gsel001/one-meal-forward/blob/main/docs/governance/CHARTER.md). Under the proposed Charter, a constitutional amendment requires public notice, independent reviews, qualified council and community support, and founder consent while the founder is serving and not conflicted. No individual can waive safety or independent review.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Ordinary project governance
        - Role or permission change
        - Representative election or recall
        - Constitutional amendment
        - Repository ownership or organization transfer
        - Safeguarding or member rights
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Exact proposed change
      description: Describe the current rule and proposed wording; link a draft diff when available.
      placeholder: "Current text, proposed replacement, and scope..."
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Why this helps
      description: Include alternatives, benefits, foreseeable risks, and affected contributors or partners.
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Conflicts of interest and affected permissions
      description: State relevant conflicts or write "none known". Do not include private personal information.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Proposal safeguards
      options:
        - label: I understand that submitting an issue or PR does not constitute a vote, council decision, or amendment.
          required: true
        - label: I have not included personal information, credentials, private partner records, or vulnerability exploitation details.
          required: true
        - label: I understand that no role, including the founder, can waive independent code review or legitimate safety requirements.
          required: true
