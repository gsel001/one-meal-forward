name: Request technical help for a food-relief organization
description: Suggest a defined task. Requests are reviewed before they appear on the website.
title: "[Mission]: "
labels: ["mission submission", "pending verification"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Share official organization URLs and public information only.
        Do not include beneficiary identities, aid applications, donor records, private staff contacts, credentials, screenshots of internal systems, or confidential operational data.
        Submission does not establish a partnership, authorize work, or promise a volunteer. Private evidence should stay with your organization; do not upload it here.
  - type: input
    id: organization
    attributes:
      label: Organization name and official website
      description: Maintainers will check the official source independently.
    validations:
      required: true
  - type: input
    id: public_contact
    attributes:
      label: Official public contact page
      description: Use a URL published by the organization. Do not add a person's private email or phone number.
    validations:
      required: true
  - type: dropdown
    id: authority
    attributes:
      label: Your relationship to the request
      options:
        - I am an authorized representative proposing a task
        - I am suggesting public research; organization permission is not confirmed
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Authorization and permission to publish
      description: Link to public evidence of authorization for this specific request and permission to name the organization. If either is missing, say "not confirmed". Do not paste private correspondence. A maintainer will verify the representative's authority through the official channel, after founder approval for any outreach.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Operational problem and who needs the improvement
      description: Describe a current process that staff want to improve, or label the idea as unconfirmed. Explain why existing tools are insufficient. No individual stories or records.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Small deliverable and acceptance criteria
      description: Define one result, how an authorized staff reviewer would test it, and what is out of scope. An unconfirmed idea is a proposal, not an organization request.
    validations:
      required: true
  - type: textarea
    id: technical
    attributes:
      label: Technical requirements and maintenance
      description: List relevant public tools, platforms, skills, accessibility or language needs, estimated effort, and who could maintain the result. Do not share credentials, internal system details, or private data. Prefer a task that needs no new infrastructure or recurring expense.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Location, availability, and safe coordination
      description: State online/in-person requirements, languages, age or safeguarding restrictions if confirmed, and whether a volunteer has agreed to help. Do not identify volunteers or assign shifts. Mark unknown requirements as unknown.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Staff acceptance, use, and evidence
      description: Describe the staff review role, how actual use could be checked, what evidence may be published with permission, and a way to withdraw or correct the request. Role names are enough; no private contacts. Acceptance and use are separate from an independently verified outcome.
    validations:
      required: true
  - type: input
    id: expiry
    attributes:
      label: Requested review or expiration date
      description: Use YYYY-MM-DD or "not agreed". Verified listings expire within 90 days of review. A date is a proposal until the organization and volunteer agree.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public information check
      options:
        - label: I included no sensitive personal, beneficiary, donor, credential, or confidential operational information.
          required: true
        - label: I understand that this public submission is reviewed before listing or work authorization and does not establish a partnership.
          required: true
