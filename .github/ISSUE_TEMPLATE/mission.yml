name: Suggest an organization mission
description: Public organizational requests are moderated before publication.
title: "[Mission]: "
labels: ["mission submission", "pending verification"]
body:
  - type: markdown
    attributes:
      value: "This is PUBLIC. Do not submit beneficiary details, personal contacts, private correspondence, or aid applications. Submission does not create a partnership or website listing. Use official organization channels only."
  - type: input
    id: organization
    attributes:
      label: Organization name and official website
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Official public request and authorization evidence URLs
      description: Maintainers must independently verify authorization before publication.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Specific task and completion criteria
      description: Include skills, estimated effort, and a safe official next step. No invented outcomes.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Location, languages, and accessibility
      description: Include online/in-person availability, age restrictions, and safeguarding requirements. No private addresses.
    validations:
      required: true
  - type: input
    id: expiry
    attributes:
      label: Expiration date and official public contact URL
      description: Use YYYY-MM-DD, no more than 90 days after verification.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public submission agreement
      options:
        - label: I am authorized to suggest this request and consent to public moderation. I included no sensitive personal information.
          required: true
